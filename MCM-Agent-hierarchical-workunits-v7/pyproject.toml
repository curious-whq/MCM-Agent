[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcm-agent"
version = "0.0.9"
description = "Prototype for hierarchical case-preserving microarchitectural memory-model abstraction"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
mcm-static = "frontend.cli:main"
mcm-plan = "frontend.module_cli:main"
